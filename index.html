<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>SkyView Ultimate: brújula por dirección</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/astronomy-engine@2.1.19/astronomy.browser.min.js"></script>
  <style>
  :root {
    --bg-dark: #05080d;
    --bg-blue: #12384d;
    --accent: #58a7e8;
    --text: #f3f3ef;
    --text-muted: rgba(255,255,255,0.36);
    --panel: rgba(10, 24, 36, 0.58);
    --line: rgba(255,255,255,0.78);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    overflow: hidden;
    background: linear-gradient(180deg, #000 0%, #000 56%, #04131d 70%, #12384d 100%);
    color: var(--text);
    font-family: Inter, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  }

  #canvas-container {
    position: absolute;
    inset: 0;
    z-index: 1;
  }

  #ui-layer {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: #000;
    z-index: 30;
    transition: opacity 0.35s ease;
  }

  .title-flat {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.08em;
    margin-bottom: 8px;
    text-transform: uppercase;
  }

  .subtitle-flat {
    font-size: 14px;
    color: rgba(255,255,255,0.5);
    margin-bottom: 32px;
    text-transform: uppercase;
    letter-spacing: 0.12em;
  }

  button {
    background: white;
    color: black;
    border: none;
    padding: 16px 32px;
    font-size: 14px;
    font-weight: 700;
    border-radius: 999px;
    cursor: pointer;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    transition: transform 0.1s;
  }

  button:active {
    transform: scale(0.98);
  }

  /* fondo degradado inferior */
 #horizon-shadow {
  position: absolute;
  bottom: 0;
  left: 0;
  width: 100vw;
  height: 35vh;
  background: linear-gradient(to top, rgba(0,0,0,0.35) 0%, rgba(0,0,0,0.12) 30%, rgba(0,0,0,0) 100%);
  z-index: 2;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.1s linear;
}

  /* tracker superior */
  #mission-tracker {
    position: absolute;
    top: 26px;
    left: 30px;
    z-index: 20;
    display: flex;
    align-items: center;
    gap: 14px;
    font-size: 18px;
    letter-spacing: 0.03em;
    pointer-events: none;
  }

  .tracker-item {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    color: var(--text-muted);
    position: relative;
  }

  .tracker-item::after {
    content: '';
    position: absolute;
    right: -8px;
    top: 50%;
    transform: translateY(-50%);
    width: 1px;
    height: 38px;
    background: rgba(255,255,255,0.18);
  }

  .tracker-item:last-child::after {
    display: none;
  }

  .tracker-item.active {
    color: var(--text);
  }

  .tracker-item.active .tracker-star {
    color: var(--accent);
  }

  .tracker-star {
    font-size: 20px;
    line-height: 1;
    transform: translateY(-1px);
  }

  /* scanner central */
#scanner-ui {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 110px;
  height: 110px;
  transform: translate(-50%, -50%);
  z-index: 15;
  pointer-events: none;
}

  #scanner-ring {
    position: absolute;
    inset: 0;
    border-radius: 50%;
    border: 1.5px solid rgba(255,255,255,0.82);
  }

#scanner-progress {
  position: absolute;
  inset: 0;
  border-radius: 50%;
  opacity: 0;
  background:
    conic-gradient(
      rgba(255,255,255,0.96) calc(var(--progress, 0) * 1%),
      rgba(255,255,255,0.14) 0
    );
  mask: radial-gradient(
    transparent 0 47px,
    black 48px 55px,
    transparent 56px 100%
  );
  -webkit-mask: radial-gradient(
    transparent 0 47px,
    black 48px 55px,
    transparent 56px 100%
  );
  filter: drop-shadow(0 0 8px rgba(88,167,232,0.55));
  transition: opacity 0.15s ease;
}

#scanner-ui.capturing #scanner-progress {
  opacity: 1;
}

#scanner-ui.capture-complete #scanner-progress {
  opacity: 0;
}
#scanner-ui.locked-preview #scanner-cross {
  opacity: 0.35;
}
 #scanner-cross {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 28px;
  height: 28px;
  transform: translate(-50%, -50%);
  opacity: 0.85;
}

#scanner-cross::before {
  width: 1.5px;
  height: 24px;
}

#scanner-cross::after {
  width: 24px;
  height: 1.5px;
}

  #scanner-cross::before {
    width: 1.5px;
    height: 36px;
  }

  #scanner-cross::after {
    width: 36px;
    height: 1.5px;
  }

  #guide-arrow {
  position: absolute;
  left: 50%;
  top: 50%;
  width: 0;
  height: 0;
  border-left: 12px solid transparent;
  border-right: 12px solid transparent;
  border-bottom: 24px solid rgba(255,255,255,0.96);
transform-origin: 50% 36px;
  filter: drop-shadow(0 2px 6px rgba(0,0,0,0.45));
}
  #target-hud {
  position: absolute;
  left: 50%;
  bottom: 78px;
  transform: translateX(-50%);
  text-align: center;
  z-index: 10;
  opacity: 0;
  transition: opacity 0.2s ease;
  pointer-events: none;
}

  .pill {
    background: rgba(10,24,36,0.72);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    border: 1px solid rgba(255,255,255,0.16);
    padding: 8px 20px;
    border-radius: 14px;
    font-size: 18px;
    font-weight: 700;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    text-shadow: 0 2px 4px rgba(0,0,0,0.5);
  }

  .target-type {
    display: block;
    font-size: 11px;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
    margin-top: 8px;
    letter-spacing: 0.16em;
    text-shadow: 0 1px 2px rgba(0,0,0,0.8);
  }

  /* brújula */
  #compass-container {
    position: fixed;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    width: min(92vw, 520px);
    height: 40px;
    overflow: hidden;
    z-index: 30;
    pointer-events: none;
    mask-image: linear-gradient(to right, transparent 0%, black 16%, black 84%, transparent 100%);
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 16%, black 84%, transparent 100%);
  }

  #compass-strip {
    position: absolute;
    top: 0;
    left: 50%;
    white-space: nowrap;
    will-change: transform;
  }

  #compass-strip span {
    display: inline-block;
    width: 64px;
    text-align: center;
    font-size: 18px;
    font-weight: 800;
    color: rgba(255,255,255,0.88);
    letter-spacing: 0.04em;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }

  #compass-pointer {
    position: fixed;
    bottom: 8px;
    left: 50%;
    transform: translateX(-50%);
    color: #fff;
    font-size: 14px;
    z-index: 31;
    text-shadow: 0 2px 4px rgba(0,0,0,1);
    pointer-events: none;
  }

  /* sys info */
  #sys-info {
    position: absolute;
    left: 30px;
    bottom: 82px;
    font-size: 10px;
    color: rgba(255,255,255,0.42);
    z-index: 18;
    font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    letter-spacing: 0.12em;
  }

  /* panel orientación actual */
  #orientation-panel {
  position: absolute;
  right: 18px;
  bottom: 82px;
  z-index: 12;
  min-width: 220px;
  background: var(--panel);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 12px;
  padding: 12px 14px;
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  font-family: monospace;
  font-size: 12px;
  line-height: 1.55;
  color: #e8e8e8;
}

  #orientation-panel .title {
    font-family: Inter, sans-serif;
    font-size: 11px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.58);
    margin-bottom: 6px;
  }

  #orientation-panel .row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
  }

  #orientation-panel .label {
    color: rgba(255,255,255,0.45);
  }

  #orientation-panel .value {
    color: #fff;
    font-weight: 600;
  }

  .oculto {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>


  <div id="target-hud">
    <div class="pill" id="target-name">--</div>
    <span class="target-type" id="target-desc">--</span>
  </div>

  <div id="horizon-shadow"></div>
<div id="mission-tracker">
  <div class="tracker-item active"><span class="tracker-star">★</span><span>1924</span></div>
  <div class="tracker-item"><span class="tracker-star">☆</span><span>1928</span></div>
  <div class="tracker-item"><span class="tracker-star">☆</span><span>1930</span></div>
  <div class="tracker-item"><span class="tracker-star">☆</span><span>1950</span></div>
</div>

<div id="scanner-ui">
  <div id="guide-arrow"></div>
  <div id="scanner-ring"></div>
  <div id="scanner-progress"></div>
  <div id="scanner-cross"></div>
</div>
  <div id="compass-container" class="oculto">
  <div id="compass-strip">
    <span>N</span><span>NE</span><span>E</span><span>SE</span><span>S</span><span>SO</span><span>O</span><span>NO</span>
    <span>N</span><span>NE</span><span>E</span><span>SE</span><span>S</span><span>SO</span><span>O</span><span>NO</span>
    <span>N</span><span>NE</span><span>E</span><span>SE</span><span>S</span><span>SO</span><span>O</span><span>NO</span>
  </div>
</div>

  <div id="orientation-panel" class="oculto">
    <div class="title">Vista del observador</div>
    <div class="row"><span class="label">dirección</span><span class="value" id="look-direction">--</span></div>
    <div class="row"><span class="label">azimut</span><span class="value" id="look-azimuth">--</span></div>
    <div class="row"><span class="label">altura</span><span class="value" id="look-altitude">--</span></div>
    <div class="row"><span class="label">norte ref</span><span class="value" id="northref-val">--</span></div>
  </div>

  <div id="canvas-container"></div>
  <div id="sys-info" class="oculto">SYS.OFF</div>

  <div id="ui-layer">
    <div class="title-flat">OBSERVATORIO</div>
    <div class="subtitle-flat">Alineación Espacial</div>
    <button onclick="iniciarApp()">Iniciar Enlace</button>
  </div>

<script>
let scene, camera, renderer, starGroup;
let raycaster, centerScreen;
let hoverRing;
let skyDome = null;
let missionStarSprite = null;
let missionStarMesh = null;
let objetosInteractivos = [];
let objetoEnfocado = null;
let astrosDinamicos = [];
let missionStarIcon = null;
let captureProgress = 0;
let captureStartTime = null;
let captureCompleted = false;
const CAPTURE_DURATION = 2000;


  const uiLayer = document.getElementById('ui-layer');
  const hud = document.getElementById('target-hud');
  const hudName = document.getElementById('target-name');
  const hudDesc = document.getElementById('target-desc');
  const compassStrip = document.getElementById('compass-strip');
  const horizonShadow = document.getElementById('horizon-shadow');
const guideArrow = document.getElementById('guide-arrow');
const scannerUi = document.getElementById('scanner-ui');

  const lookDirectionVal = document.getElementById('look-direction');
  const lookAzimuthVal = document.getElementById('look-azimuth');
  const lookAltitudeVal = document.getElementById('look-altitude');
  const northRefVal = document.getElementById('northref-val');

const COMPASS_STEP = 64;               // ancho de cada letra
const COMPASS_CYCLE_WIDTH = 8 * 64;    // 8 direcciones = 512px
let compassAzimuthVisual = null;       // azimut visual suavizado

// CAMBIÁ esta ruta por la tuya
const SKY_TEXTURE_URL = '/assets/img/bg-dome.jpg';

 let usuarioLat = 0, usuarioLon = 0;
let brujulaDetectada = false;
let headingOffset = 0;
let currentAlpha = 0, currentBeta = 0, currentGamma = 0;

// filtro anti-salto para iPhone
let headingEstable = null;
const TILT_GUARD_DEG = 38;
const HEADING_JUMP_DEG = 110;
const LOW_SPIN_THRESHOLD = 90;
const BUILD_LABEL = '2026-04-30 22:00 UTC';

// Sigue existiendo como dato de diagnóstico
let northCalibration = null;

  const planetas = ['Sun', 'Moon', 'Venus', 'Mars', 'Jupiter', 'Saturn'];

  const estrellas = [
    { id: 'scga1924', n: "SCGA 1924 (Puppis)", ra: 8.3098, dec: -26.2482 },
    { id: 'scga1928', n: "SCGA 1928 (Puppis)", ra: 8.3198, dec: -23.0249 },
    { id: 'scga1930', n: "SCGA 1930 (Puppis)", ra: 8.3217, dec: -23.7969 },
    { id: 'scga1950', n: "SCGA 1950 (Volans)", ra: 8.2952, dec: -69.1289 },

    { id: 'sirius', n: "Sirio", ra: 6.75, dec: -16.71 },
    { id: 'canopus', n: "Canopus", ra: 6.39, dec: -52.69 },
    { id: 'arcturus', n: "Arturo", ra: 14.26, dec: 19.18 },
    { id: 'rigelkent', n: "Alfa Centauri", ra: 14.66, dec: -60.83 },
    { id: 'vega', n: "Vega", ra: 18.61, dec: 38.78 },
    { id: 'capella', n: "Capella", ra: 5.28, dec: 45.99 },
    { id: 'rigel', n: "Rigel", ra: 5.24, dec: -8.2 },
    { id: 'procyon', n: "Procyon", ra: 7.65, dec: 5.22 },
    { id: 'achernar', n: "Achernar", ra: 1.63, dec: -57.24 },
    { id: 'betelgeuse', n: "Betelgeuse", ra: 5.91, dec: 7.4 },
    { id: 'hadar', n: "Beta Centauri", ra: 14.06, dec: -60.37 },
    { id: 'altair', n: "Altair", ra: 19.84, dec: 8.86 },
    { id: 'aldebaran', n: "Aldebarán", ra: 4.59, dec: 16.50 },
    { id: 'spica', n: "Spica", ra: 13.41, dec: -11.16 },
    { id: 'antares', n: "Antares", ra: 16.49, dec: -26.43 },
    { id: 'pollux', n: "Pólux", ra: 7.75, dec: 28.02 },
    { id: 'fomalhaut', n: "Fomalhaut", ra: 22.96, dec: -29.62 },
    { id: 'deneb', n: "Deneb", ra: 20.69, dec: 45.28 },

    { id: 'acrux', n: "Acrux", ra: 12.44, dec: -63.09 },
    { id: 'mimosa', n: "Mimosa", ra: 12.78, dec: -59.68 },
    { id: 'gacrux', n: "Gacrux", ra: 12.51, dec: -57.11 },
    { id: 'imai', n: "Imai", ra: 12.25, dec: -58.74 },
    { id: 'bellatrix', n: "Bellatrix", ra: 5.41, dec: 6.34 },
    { id: 'alnilam', n: "Alnilam", ra: 5.6, dec: -1.2 },
    { id: 'alnitak', n: "Alnitak", ra: 5.67, dec: -1.94 },
    { id: 'mintaka', n: "Mintaka", ra: 5.53, dec: -0.29 },
    { id: 'saiph', n: "Saiph", ra: 5.79, dec: -9.66 },

    { id: 'polaris', n: "Estrella Polar", ra: 2.53, dec: 89.26 }
  ];


  function seededRandom(seed) {
    const x = Math.sin(seed) * 10000;
    return x - Math.floor(x);
  }

  function generarEstrellasExtra(cantidad = 520) {
    const extra = [];
    for (let i = 0; i < cantidad; i++) {
      const r1 = seededRandom(i * 1.137 + 11.7);
      const r2 = seededRandom(i * 1.913 + 27.1);
      const r3 = seededRandom(i * 2.271 + 41.9);

      extra.push({
        id: `extra_${i + 1}`,
        n: `Star ${String(i + 1).padStart(3, '0')}`,
        ra: r1 * 24,
        dec: Math.asin((r2 * 2) - 1) * 180 / Math.PI,
        mag: 1.5 + r3 * 4.5,
        extra: true
      });
    }
    return extra;
  }

  const estrellasExtra = generarEstrellasExtra(520);
  const todasLasEstrellas = [...estrellas, ...estrellasExtra];

  const constelaciones = [
    ['betelgeuse', 'bellatrix'], ['bellatrix', 'rigel'], ['rigel', 'saiph'], ['saiph', 'betelgeuse'],
    ['mintaka', 'alnilam'], ['alnilam', 'alnitak'],
    ['gacrux', 'acrux'], ['mimosa', 'imai']
  ];
function crearSkyDome() {
  const loader = new THREE.TextureLoader();

  loader.load(
    SKY_TEXTURE_URL,
    (texture) => {
      texture.colorSpace = THREE.SRGBColorSpace;
      texture.minFilter = THREE.LinearFilter;
      texture.magFilter = THREE.LinearFilter;

      const geometry = new THREE.SphereGeometry(2200, 64, 64);
      geometry.scale(-1, 1, 1);

      const material = new THREE.MeshBasicMaterial({
        map: texture,
        side: THREE.BackSide
      });

      skyDome = new THREE.Mesh(geometry, material);
      scene.add(skyDome);
    },
    undefined,
    (err) => {
      console.warn('No se pudo cargar la textura de la bóveda:', err);

      const geometry = new THREE.SphereGeometry(2200, 64, 64);
      geometry.scale(-1, 1, 1);

      const fallbackMaterial = new THREE.MeshBasicMaterial({
        color: 0x000000,
        side: THREE.BackSide
      });

      skyDome = new THREE.Mesh(geometry, fallbackMaterial);
      scene.add(skyDome);
    }
  );
}
  function init3D() {
    scene = new THREE.Scene();
    camera = new THREE.PerspectiveCamera(70, window.innerWidth / window.innerHeight, 0.1, 2500);
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false });
renderer.setClearColor(0x000000, 1);
    renderer.setSize(window.innerWidth, window.innerHeight);
    document.getElementById('canvas-container').appendChild(renderer.domElement);

    starGroup = new THREE.Group();
scene.add(starGroup);

crearSkyDome();

    raycaster = new THREE.Raycaster();
    raycaster.params.Points.threshold = 15;
    centerScreen = new THREE.Vector2(0, 0);

    const ringGeo = new THREE.RingGeometry(35, 38, 32);
    const ringMat = new THREE.MeshBasicMaterial({
      color: 0xffffff,
      side: THREE.DoubleSide,
      transparent: true,
      opacity: 0.8
    });
  hoverRing = new THREE.Mesh(ringGeo, ringMat);
hoverRing.visible = false;
scene.add(hoverRing);

// Sprite 3D que reemplaza visualmente a la estrella cuando entra en el círculo
missionStarSprite = createStarSprite('★', '#ffffff', 64);
missionStarSprite.visible = false;
scene.add(missionStarSprite);

animar();
  }

  function azAltToVector(azimuth, altitude, radius = 500) {
    const azRad = THREE.MathUtils.degToRad(azimuth);
    const altRad = THREE.MathUtils.degToRad(altitude);
    return new THREE.Vector3(
      radius * Math.cos(altRad) * Math.sin(azRad),
      radius * Math.sin(altRad),
      -radius * Math.cos(altRad) * Math.cos(azRad)
    );
  }
function createStarSprite(symbol = '★', color = '#ffffff', size = 96) {
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 256;

  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, canvas.width, canvas.height);

  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.font = '900 150px Arial';
  ctx.fillStyle = color;
  ctx.shadowColor = 'rgba(88,167,232,0.35)';
  ctx.shadowBlur = 18;
  ctx.fillText(symbol, canvas.width / 2, canvas.height / 2 + 4);

  const texture = new THREE.CanvasTexture(canvas);
  const material = new THREE.SpriteMaterial({
    map: texture,
    transparent: true,
    depthWrite: false
  });

  const sprite = new THREE.Sprite(material);
  sprite.scale.set(size, size, 1);
  return sprite;
}
  function generarCieloReal() {
    const fechaActual = new Date();
    const observador = new Astronomy.Observer(usuarioLat, usuarioLon, 0);
    const posicionesEstrellas = {};

    planetas.forEach(cuerpo => {
      const equ_2000 = Astronomy.Equator(cuerpo, fechaActual, observador, true, true);
      const horizonte = Astronomy.Horizon(fechaActual, observador, equ_2000.ra, equ_2000.dec, 'normal');
      const pos = azAltToVector(horizonte.azimuth, horizonte.altitude, 500);

      const size = (cuerpo === 'Sun' || cuerpo === 'Moon') ? 16 : 8;
      const mesh = new THREE.Mesh(
        new THREE.SphereGeometry(size, 32, 32),
        new THREE.MeshBasicMaterial({ color: cuerpo === 'Sun' ? 0xffdd44 : 0xeeeeee })
      );
      mesh.position.copy(pos);
      mesh.userData = {
        nombre: cuerpo === 'Sun' ? 'Sol' : cuerpo === 'Moon' ? 'Luna' : cuerpo,
        tipo: 'Sistema Solar'
      };

      starGroup.add(mesh);
      objetosInteractivos.push(mesh);
      astrosDinamicos.push({ mesh: mesh, tipoRef: 'planeta', id: cuerpo });
    });

    todasLasEstrellas.forEach(estrella => {
      const horizonte = Astronomy.Horizon(fechaActual, observador, estrella.ra, estrella.dec, 'normal');
      const pos = azAltToVector(horizonte.azimuth, horizonte.altitude, 800);
      posicionesEstrellas[estrella.id] = pos;

     const tam = estrella.extra ? Math.max(1.2, 4.2 - ((estrella.mag ?? 4) * 0.55)) : 5;

const mesh = new THREE.Mesh(
  new THREE.SphereGeometry(tam, estrella.extra ? 8 : 16, estrella.extra ? 8 : 16),
  new THREE.MeshBasicMaterial({ color: 0xffffff })
);
      mesh.position.copy(pos);
      mesh.userData = {
  nombre: estrella.n,
  tipo: estrella.extra
    ? 'Estrella de fondo'
    :  (['scga1924', 'scga1928', 'scga1930', 'scga1950'].includes(estrella.id) ? 'Objetivo Colombes' : 'Estrella principal'),  ra: estrella.ra,
  dec: estrella.dec,
  code: estrella.code,
  short: estrella.short,
  gmag: estrella.gmag ?? null,
  gaia: estrella.gaia ?? null,
  constellation: estrella.constellation ?? null,
  mission: ['scga1924', 'scga1928', 'scga1930', 'scga1950'].includes(estrella.id),
  defaultScale: tam,
  isStarIcon: false
};

      starGroup.add(mesh);
      if (!estrella.extra) {
        objetosInteractivos.push(mesh);
      }
      astrosDinamicos.push({ mesh: mesh, tipoRef: 'estrella', ra: estrella.ra, dec: estrella.dec, id: estrella.id, extra: !!estrella.extra, mag: estrella.mag ?? null });
    });

    const lineMaterial = new THREE.LineBasicMaterial({
      color: 0xffffff,
      transparent: true,
      opacity: 0.2
    });

    constelaciones.forEach(par => {
      if (posicionesEstrellas[par[0]] && posicionesEstrellas[par[1]]) {
        const puntos = [posicionesEstrellas[par[0]], posicionesEstrellas[par[1]]];
        const lineGeo = new THREE.BufferGeometry().setFromPoints(puntos);
        const linea = new THREE.Line(lineGeo, lineMaterial);

        starGroup.add(linea);
        astrosDinamicos.push({ mesh: linea, tipoRef: 'linea', p1: par[0], p2: par[1] });
      }
    });

    const dustGeo = new THREE.BufferGeometry();
    const dustVerts = [];
    for (let i = 0; i < 1500; i++) {
      const rPos = azAltToVector(Math.random() * 360, (Math.random() * 180) - 90, 1000);
      dustVerts.push(rPos.x, rPos.y, rPos.z);
    }
    dustGeo.setAttribute('position', new THREE.Float32BufferAttribute(dustVerts, 3));
    starGroup.add(new THREE.Points(dustGeo, new THREE.PointsMaterial({ color: 0x555555, size: 2 })));

    setInterval(actualizarTiempoYPosiciones, 60000);
  }

  function actualizarTiempoYPosiciones() {
    const nuevaFecha = new Date();
    const observador = new Astronomy.Observer(usuarioLat, usuarioLon, 0);
    const posicionesActualizadas = {};

    astrosDinamicos.forEach(astro => {
      if (astro.tipoRef === 'planeta' || astro.tipoRef === 'estrella') {
        let horizonte;
        if (astro.tipoRef === 'planeta') {
          const equ_2000 = Astronomy.Equator(astro.id, nuevaFecha, observador, true, true);
          horizonte = Astronomy.Horizon(nuevaFecha, observador, equ_2000.ra, equ_2000.dec, 'normal');
        } else {
          horizonte = Astronomy.Horizon(nuevaFecha, observador, astro.ra, astro.dec, 'normal');
        }

        const nuevaPos = azAltToVector(
          horizonte.azimuth,
          horizonte.altitude,
          astro.tipoRef === 'planeta' ? 500 : 800
        );

        astro.mesh.position.copy(nuevaPos);
        if (astro.id) posicionesActualizadas[astro.id] = nuevaPos;
      }
    });

    astrosDinamicos.forEach(astro => {
      if (astro.tipoRef === 'linea' && posicionesActualizadas[astro.p1] && posicionesActualizadas[astro.p2]) {
        const positions = astro.mesh.geometry.attributes.position.array;
        positions[0] = posicionesActualizadas[astro.p1].x;
        positions[1] = posicionesActualizadas[astro.p1].y;
        positions[2] = posicionesActualizadas[astro.p1].z;
        positions[3] = posicionesActualizadas[astro.p2].x;
        positions[4] = posicionesActualizadas[astro.p2].y;
        positions[5] = posicionesActualizadas[astro.p2].z;
        astro.mesh.geometry.attributes.position.needsUpdate = true;
      }
    });
  }

  function procesarSensores(e) {
    if (e.alpha === null) return;

    currentAlpha = e.alpha;
    currentBeta = e.beta ?? 0;
    currentGamma = e.gamma ?? 0;

    let absoluteHeading = null;

    if (typeof e.webkitCompassHeading === 'number') {
      absoluteHeading = e.webkitCompassHeading;
      brujulaDetectada = true;
    } else if (e.absolute === true && typeof e.alpha === 'number') {
      absoluteHeading = (360 - e.alpha + 360) % 360;
      brujulaDetectada = true;
    }

    if (absoluteHeading !== null) {
      headingOffset = absoluteHeading;

      if (northCalibration === null) {
        northCalibration = absoluteHeading;
      }
    }
  }

  async function iniciarApp() {
    document.querySelector('.title-flat').innerText = "AUTORIZANDO...";

    if (typeof DeviceOrientationEvent !== 'undefined' && typeof DeviceOrientationEvent.requestPermission === 'function') {
      try {
        const permisoSensores = await DeviceOrientationEvent.requestPermission();
        if (permisoSensores !== 'granted') return alert("Permiso de sensores denegado.");
      } catch (e) {
        return alert("Interactúa con la pantalla primero.");
      }
    }

    document.querySelector('.title-flat').innerText = "BUSCANDO GPS...";

    navigator.geolocation.getCurrentPosition((pos) => {
      usuarioLat = pos.coords.latitude;
      usuarioLon = pos.coords.longitude;

      document.getElementById('sys-info').innerText = `LAT:${usuarioLat.toFixed(2)} // LON:${usuarioLon.toFixed(2)}`;
      document.getElementById('sys-info').classList.remove('oculto');

      generarCieloReal();

      northCalibration = null;

      if ('ondeviceorientationabsolute' in window) {
        window.addEventListener('deviceorientationabsolute', procesarSensores);
      } else {
        window.addEventListener('deviceorientation', procesarSensores);
      }

      setTimeout(() => {
        uiLayer.classList.add('oculto');
document.getElementById('compass-container').classList.remove('oculto');
document.getElementById('compass-pointer').classList.remove('oculto');
document.getElementById('orientation-panel').classList.remove('oculto');
 }, 500);

    }, () => alert("Error de GPS."));
  }

  function azimuthToDirection(azimuth) {
    const dirs = ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'];
    return dirs[Math.round((((azimuth % 360) + 360) % 360) / 45) % 8];
  }
function shortestAngleDiff(from, to) {
  let diff = to - from;
  while (diff > 180) diff -= 360;
  while (diff < -180) diff += 360;
  return diff;
}
  function directionToIndex(dir) {
    return ['N', 'NE', 'E', 'SE', 'S', 'SO', 'O', 'NO'].indexOf(dir);
  }

  function getObserverLookFromCamera() {
    const dir = new THREE.Vector3();
    camera.getWorldDirection(dir);

    let azimuth = THREE.MathUtils.radToDeg(Math.atan2(dir.x, -dir.z));
    azimuth = (azimuth + 360) % 360;

    const altitude = THREE.MathUtils.radToDeg(Math.asin(dir.y));

    return {
      azimuth,
      altitude,
      direction: azimuthToDirection(azimuth)
    };
  }
function worldToScreen(pos) {
  const projected = pos.clone().project(camera);
  return {
    x: (projected.x * 0.5 + 0.5) * window.innerWidth,
    y: (-projected.y * 0.5 + 0.5) * window.innerHeight,
    z: projected.z
  };
}
  function actualizarPanelOrientaciones() {
  const look = getObserverLookFromCamera();

  lookDirectionVal.textContent = look.direction;
  lookAzimuthVal.textContent = `${look.azimuth.toFixed(1)}°`;
  lookAltitudeVal.textContent = `${look.altitude.toFixed(1)}°`;
  northRefVal.textContent = northCalibration != null ? `${northCalibration.toFixed(1)}°` : '--';

  // =========================
  // BRÚJULA INFERIOR FLUIDA
  // =========================

  if (compassAzimuthVisual === null) {
    compassAzimuthVisual = look.azimuth;
  }

  // suavizado angular
  const diff = shortestAngleDiff(compassAzimuthVisual, look.azimuth);
  compassAzimuthVisual += diff * 0.14;
  compassAzimuthVisual = (compassAzimuthVisual + 360) % 360;

  // Conversión de azimut a píxeles:
  // 45° = 64px
  const pxPerDegree = COMPASS_STEP / 45;

  // Usamos la segunda vuelta (la del medio) para que siempre haya margen
  // + COMPASS_STEP/2 centra la letra exactamente en la flecha
  const x = -(
    COMPASS_CYCLE_WIDTH +               // segunda vuelta
    (compassAzimuthVisual * pxPerDegree) +
    (COMPASS_STEP / 2)                  // centra la letra en la flecha
  );

  if (compassStrip) {
    compassStrip.style.transform = `translateX(${x}px)`;
  }
}
function setMissionStarVisual(astro, useStarIcon) {
  if (!astro || !astro.mesh || astro.extra || !missionStarSprite) return;

  const mesh = astro.mesh;

  if (useStarIcon) {
    // Guardamos cuál estrella está convertida
    missionStarMesh = mesh;

    // Ocultamos visualmente la bolita original, pero sin eliminarla
    // para que siga funcionando la posición y la lógica.
    if (mesh.material) {
      mesh.material.transparent = true;
      mesh.material.opacity = 0;
      mesh.material.needsUpdate = true;
    }

    // Ponemos el ícono ★ exactamente donde está ESA estrella
    missionStarSprite.position.copy(mesh.position);
    missionStarSprite.visible = true;

    mesh.userData.isStarIcon = true;
  } else {
    // Restauramos la estrella original
    if (mesh.material) {
      mesh.material.transparent = true;
      mesh.material.opacity = 1;
      mesh.material.needsUpdate = true;
    }

    // Si la estrella que sale era la convertida, ocultamos el sprite
    if (missionStarMesh === mesh) {
      missionStarSprite.visible = false;
      missionStarMesh = null;
    }

    mesh.userData.isStarIcon = false;
  }
}
function actualizarCargaCaptura(insideCircle) {
  const scannerProgress = document.getElementById('scanner-progress');

  if (!scannerProgress) return;

  if (insideCircle && !captureCompleted) {
    if (captureStartTime === null) {
      captureStartTime = performance.now();
      scannerUi.classList.add('capturing');
    }

    const elapsed = performance.now() - captureStartTime;
    captureProgress = Math.min(elapsed / CAPTURE_DURATION, 1);

    scannerProgress.style.setProperty('--progress', captureProgress * 100);

    if (captureProgress >= 1) {
      captureCompleted = true;
      scannerUi.classList.remove('capturing');
      scannerUi.classList.add('capture-complete');

      // Acá después hacemos aparecer los datos
      console.log('Captura completa: mostrar datos');
    }
  } else if (!insideCircle) {
    captureStartTime = null;
    captureProgress = 0;
    captureCompleted = false;

    scannerUi.classList.remove('capturing');
    scannerUi.classList.remove('capture-complete');
    scannerProgress.style.setProperty('--progress', 0);
  }
}
function actualizarGuiaVisual() {
  const target = astrosDinamicos.find(
    astro => astro.id === 'scga1924' && astro.tipoRef === 'estrella'
  );

  if (!target || !target.mesh) {
    guideArrow.style.opacity = '0';
    return;
  }

  const screen = worldToScreen(target.mesh.position);
  const centerX = window.innerWidth / 2;
  const centerY = window.innerHeight / 2;

  const dx = screen.x - centerX;
  const dy = screen.y - centerY;
const dist = Math.hypot(dx, dy);
const insideCircle = dist <= 54;

scannerUi.classList.toggle('locked-preview', insideCircle);
setMissionStarVisual(target, insideCircle);
actualizarCargaCaptura(insideCircle);

if (missionStarSprite && missionStarSprite.visible && missionStarMesh) {
  missionStarSprite.position.copy(missionStarMesh.position);
}
 
 const angle = Math.atan2(dy, dx) * 180 / Math.PI + 90;
const radius = 46;

guideArrow.style.opacity = insideCircle ? '0' : '1';
guideArrow.style.transform = `translate(-50%, -56%) rotate(${angle}deg) translateY(-${radius}px)`;
}
  function actualizarCamaraYUI() {
  if (!brujulaDetectada) return;

  const alphaRad = brujulaDetectada
    ? THREE.MathUtils.degToRad(360 - headingOffset)
    : THREE.MathUtils.degToRad(currentAlpha);

  const betaRad = THREE.MathUtils.degToRad(currentBeta || 0);
  const gammaRad = THREE.MathUtils.degToRad(currentGamma || 0);
  const screenRot = window.orientation ? THREE.MathUtils.degToRad(window.orientation) : 0;

  // Quaternion crudo del dispositivo
  const qDispositivo = new THREE.Quaternion().setFromEuler(
    new THREE.Euler(betaRad, alphaRad, -gammaRad, 'YXZ')
  );

  qDispositivo.multiply(
    new THREE.Quaternion(-Math.sqrt(0.5), 0, 0, Math.sqrt(0.5))
  );

  qDispositivo.multiply(
    new THREE.Quaternion().setFromAxisAngle(
      new THREE.Vector3(0, 0, 1),
      -screenRot
    )
  );

  // En vez de copiar el roll completo a la cámara,
  // sacamos solo la DIRECCIÓN hacia donde apunta.
  const forward = new THREE.Vector3(0, 0, -1)
    .applyQuaternion(qDispositivo)
    .normalize();

  // Convertimos esa dirección a azimut/altura
  let azimuth = THREE.MathUtils.radToDeg(Math.atan2(forward.x, -forward.z));
  azimuth = (azimuth + 360) % 360;

  const altitude = THREE.MathUtils.radToDeg(Math.asin(forward.y));

  // Reconstruimos una dirección limpia sin roll
  const targetDir = azAltToVector(azimuth, altitude, 10);

  camera.position.set(0, 0, 0);
  camera.up.set(0, 1, 0);
  camera.lookAt(targetDir);

  // sombra horizonte
  if (forward.y < 0.1) {
    let opacidadSombra = 1.0 - ((forward.y + 0.2) / 0.3);
    if (opacidadSombra > 1) opacidadSombra = 1;
    if (opacidadSombra < 0) opacidadSombra = 0;
    horizonShadow.style.opacity = opacidadSombra;
  } else {
    horizonShadow.style.opacity = 0;
  }

  actualizarPanelOrientaciones();
actualizarGuiaVisual();
}

  function verificarIntersecciones() {
    raycaster.setFromCamera(centerScreen, camera);
    const colisiones = raycaster.intersectObjects(objetosInteractivos.filter(obj => obj.visible));
    if (colisiones.length > 0) {
      const objetivo = colisiones[0].object;

      if (objetoEnfocado !== objetivo) {
        if (objetoEnfocado) objetoEnfocado.scale.set(1, 1, 1);
        objetoEnfocado = objetivo;
        objetoEnfocado.scale.set(1.5, 1.5, 1.5);
      }

      // Ocultamos el círculo visual de captura
        hoverRing.visible = false;

      hudName.innerText = objetivo.userData.nombre;
hudDesc.innerText = objetivo.userData.tipo;
hud.style.opacity = objetivo.userData.nombre === 'COLOMBES 1924' ? 1 : 0.7;
    } else {
      if (objetoEnfocado) {
        objetoEnfocado.scale.set(1, 1, 1);
        objetoEnfocado = null;
      }
      hoverRing.visible = false;
      hud.style.opacity = 0;
    }
  }

  function animar() {
    requestAnimationFrame(animar);
    actualizarCamaraYUI();
    verificarIntersecciones();
    renderer.render(scene, camera);
  }

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });

  init3D();
</script>
